services:
  - type: web
    name: gridly-api
    runtime: python
    plan: free
    buildCommand: pip install -r app/backend/requirements.txt
    startCommand: uvicorn app.main:app --app-dir app/backend --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/v1/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: gridly-db
          property: connectionString
      - key: FRONTEND_ORIGINS
        sync: false
      - key: RPC_URL
        sync: false
      - key: CHAIN_ID
        sync: false
      - key: CONTRACT_ADDRESS
        sync: false
      - key: TRADE_AUTH_SIGNER_PRIVATE_KEY
        sync: false
      - key: PREVIEW_TOKEN_SIGNING_KEY
        generateValue: true
      - key: CONFIRMATION_BLOCKS
        value: "1"

databases:
  - name: gridly-db
    plan: free
